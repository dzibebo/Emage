performance:
  max-packets-per-tick: 64
  view-distance-blocks: 96

storage:
  database:
    file-name: "emage_meta.db"
    pool-size: 2

quality:
  max-gif-frames: 240
  max-gif-grid-size: 5
  max-image-grid-size: 16

downloads:
  max-file-size-mb: 50
  connect-timeout-seconds: 10
  read-timeout-seconds: 30
  max-redirects: 5
  block-internal-urls: true

cache:
  max-memory-mb: 100
  expire-minutes: 30

rate-limits:
  cooldown-seconds: 5
  max-concurrent-tasks: 3

feedback:
  use-action-bar: true
  sounds:
    enabled: true
    success: "entity.player.levelup"
    error: "entity.villager.no"
    start: "block.note_block.chime"

messages:
  prefix: "<b><gradient:#F57E3A:#CB6E38:#C36220>Emage</gradient></b> <dark_gray>•</dark_gray> "
  usage: "<red>Использование: <gray>/emage apply <url> [колонки] [строки]"
  no-frame: "<red>Вы должны смотреть на рамку."
  invalid-url: "<red>Указана недопустимая или заблокированная ссылка."
  only-players: "<red>Эту команду могут использовать только игроки."
  processing-started: "<color:#fd6039>Обработка изображения для сетки <color:#f3c6bb><width>x<height></color>. Пожалуйста, подождите..."
  downloading: "<color:#4CABBB>Загрузка...</color>"
  processing-frames: "<color:#4CABBB>Обработка кадров: <white><percent>%</white></color>"
  undo-name: "Отменить"
  undo-hover: "Нажмите, чтобы удалить это изображение"
  success: "<green>Изображение успешно наложено на <color:#f3c6bb><total></color> рамок! <gray>[<red><click:run_command:'/emage remove <sync_group_id>'><hover:show_text:'<undo_hover>'><undo_name></hover></click></red>]</gray>"
  error: "<red>Произошла ошибка: <gray><error>"
  process-error: "<red>Не удалось обработать изображение: <gray><error>"
  read-error: "<red>Ошибка чтения изображения: <gray><error>"
  max-tasks-reached: "<red>Сервер в данный момент обрабатывает максимальное количество изображений. Пожалуйста, подождите."
  cooldown-active: "<red>Слишком часто! Подождите перед наложением следующего изображения."
  auto-detect-failed: "<red>Не удалось автоматически определить сетку рамок. Пропущенное место подсвечено."
  not-enough-frames: "<red>Обнаружены недостающие рамки на этой стене. Пропущенное место подсвечено."
  gif-size-limit: "<red>GIF ограничены максимальным размером сетки <color:#f3c6bb><max_width>x<max_height></color>."
  image-size-limit: "<red>Изображения ограничены максимальным размером сетки <color:#f3c6bb><max_width>x<max_height></color>."
  gif-frame-limit: "<red>GIF ограничены максимум <color:#f3c6bb><max_frames></color> кадрами. (В предоставленной GIF: <color:#f3c6bb><frames></color>)"
  not-emage-frame: "<red>Эта рамка не содержит изображение Emage."
  metadata-not-found: "<red>Метаданные сетки не найдены в базе данных."
  grid-removed: "<green>Изображение успешно удалено."
  cleanup-failed: "<red>Не удалось очистить файлы."
  config-reloaded: "<green>Конфигурация и сообщения успешно перезагружены."
  protected-frame: "<red>Эта рамка защищена. Используйте <color:#f3c6bb>/emage remove</color>, чтобы удалить её."
  smart-url-hint: "<gray><i>Подсказка: Убедитесь, что используете прямую ссылку на изображение, заканчивающуюся на .png, .jpg или .gif (не ссылка на страницу Imgur/Discord!)</i>"
  undo-mismatch: "<red>Вы смотрите на другое изображение, не на то, для которого была кнопка отмены."
  no-permission: "<red>У вас нет прав для удаления этого изображения."
  info-header: "<gradient:#F57E3A:#CB6E38:#C36220>Информация об изображении:</gradient>"
  info-author: "<gray>Автор: <color:#f3c6bb><author></color>"
  info-date: "<gray>Дата создания: <color:#f3c6bb><date></color>"
  info-size: "<gray>Размер сетки: <color:#f3c6bb><width>x<height></color> (<total> рамок)"
  info-animated: "<gray>Анимация: <color:#f3c6bb><frames></color> кадров (<delay> мс)"
  info-url: "<gray>Источник: <click:open_url:'<url>'><hover:show_text:'Нажмите, чтобы открыть ссылку'><color:#4CABBB><u>[Открыть ссылку]</u></color></hover></click>"
  unsupported-format: "Неподдерживаемый формат изображения или повреждённый файл."
  error-unknown-host: "Не удалось найти сервер. Проверьте URL или подключение к интернету."
  error-timeout: "Сервер слишком долго отвечает. Возможно, он недоступен или перегружен."
  error-connect: "Не удалось подключиться к серверу. Хост недоступен или блокирует соединение."
  error-ssl: "Ошибка SSL/TLS. Сертификат сайта может быть недействительным."
  error-size-limit: "Превышен лимит размера загружаемого файла."
  error-dimensions-limit: "Разрешение изображения превышает допустимый безопасный предел."
  error-blocked: "Доступ к указанному IP-адресу или ресурсу заблокирован в целях безопасности."
  error-unknown: "Произошла неизвестная ошибка."
