performance:
  max-packets-per-tick: 64
  view-distance-blocks: 96
  # Animated pictures (GIFs) use much more traffic, so they are only streamed to players this close (0 = same as above).
  animated-view-distance-blocks: 64
  # Map data is sent to each player through an adaptive limiter so slow connections are not flooded
  # (a flooded connection makes ping explode and can time the player out).
  # The speed starts low and grows/shrinks automatically between these two bounds (bytes per second).
  max-bytes-per-second-per-player: 16777216
  # Hard cap for all players together (bytes per second). Encoding and compressing map packets costs CPU on the
  # network threads, so even many players joining at once cannot starve everyone else's connection.
  max-total-bytes-per-second: 41943040
  min-bytes-per-second-per-player: 16384
  # How much map data may sit unsent in a player's network buffer at once (bytes). Lower = lower ping impact.
  max-pending-bytes-per-player: 98304
  # Emage measures how long its own data makes each player wait (a tiny ping packet every ~150 ms while pictures are
  # being sent) and slows down for that player when the wait exceeds this many milliseconds.
  # Lower = smoother ping on weak connections but slower loading for them.
  target-queue-delay-ms: 80
  # Set to false to rely only on the network buffer fill level (for clients/proxies that mishandle ping packets).
  latency-probe: true

storage:
  database:
    file-name: "emage_meta.db"
    pool-size: 2

quality:
  max-gif-frames: 240
  max-gif-grid-size: 5
  max-image-grid-size: 16

downloads:
  max-file-size-mb: 50
  connect-timeout-seconds: 10
  read-timeout-seconds: 30
  max-redirects: 5
  block-internal-urls: true

cache:
  max-memory-mb: 100
  expire-minutes: 30

rate-limits:
  cooldown-seconds: 5
  max-concurrent-tasks: 3

feedback:
  use-action-bar: true
  sounds:
    enabled: true
    success: "entity.player.levelup"
    error: "entity.villager.no"
    start: "block.note_block.chime"

