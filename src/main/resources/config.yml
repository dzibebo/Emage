config-version: 6

performance:
  max-packets-per-tick: 64
  view-distance-blocks: 96
  # GIFs only animate for players this close (measured to the nearest frame of the picture). Farther away they show
  # a still frame, which costs no traffic at all. 0 = animate everywhere within view-distance-blocks.
  animated-view-distance-blocks: 48
  # Map data is sent to each player through an adaptive limiter so slow connections are not flooded
  # (a flooded connection makes ping explode and can time the player out).
  # The speed starts low, grows quickly and then follows each player's real connection: it backs off by itself as soon
  # as the player's ping starts to rise. These are only the outer bounds (bytes per second), so the maximum can be
  # generous: a player on a fast connection gets big gifs at full speed, a player on a weak one gets what fits.
  max-bytes-per-second-per-player: 8388608
  # Hard cap for all players together (bytes per second). Encoding and compressing map packets costs CPU on the
  # network threads, so even many players joining at once cannot starve everyone else's connection.
  max-total-bytes-per-second: 67108864
  # The sender never goes below this speed (bytes per second), so a player is never starved when the game answers the
  # ping packets slowly. 32768 B/s = 256 kbit/s. A connection even slower than this gets its pictures a little late
  # (and its ping up a bit); if you have players on such links lower this value (4096 is the smallest allowed).
  min-bytes-per-second-per-player: 32768
  # How much map data may sit unsent in a player's network buffer at once (bytes). Lower = lower ping impact.
  max-pending-bytes-per-player: 98304
  # Emage measures how long its own data makes each player wait (a tiny ping packet every ~100 ms while pictures are
  # being sent) and slows down for that player as soon as the wait exceeds about 1.5x this many milliseconds, so the
  # extra ping caused by pictures stays around this value. Short random spikes (VPN, far-away players) are filtered out.
  # Lower = ping stays closer to the real one but GIFs get less speed; higher = faster GIFs and more extra ping.
  # Typical choices: 20 (lowest allowed), 30 (default), 60, 100. /emage debug shows the measured values for every player.
  target-queue-delay-ms: 20
  # A player's game can only process a limited number of map updates per second (every map update makes it rebuild the
  # whole map texture). When the visible GIFs together need more than the player's budget, Emage animates the ones the
  # player is looking at and the cheapest ones, and pauses the rest on their current frame, instead of making all of
  # them stutter and raising the ping. Set to false to let every visible GIF compete for the bandwidth.
  limit-animated-gifs: true
  # A big GIF frame cannot reach the player instantly, so its maps change one after another. With true (default) they
  # change in a scattered order across the whole picture, which looks like a soft fade; with false they change from the
  # point the player looks at outwards, which looks like a moving wave.
  scatter-map-updates: true
  # Set to false to rely only on the network buffer fill level (for clients/proxies that mishandle ping packets).
  latency-probe: true

storage:
  database:
    file-name: "emage_meta.db"
    pool-size: 2

quality:
  max-gif-frames: 240
  max-gif-grid-size: 10
  max-image-grid-size: 16

downloads:
  max-file-size-mb: 50
  connect-timeout-seconds: 10
  read-timeout-seconds: 30
  max-redirects: 5
  block-internal-urls: true

cache:
  max-memory-mb: 100
  expire-minutes: 30
  # Pictures nobody has been near for this many seconds release their map data from memory and load it again when
  # a player comes back. Keeps memory use proportional to what players are actually looking at (0 = never release).
  idle-release-seconds: 300

rate-limits:
  cooldown-seconds: 5
  max-concurrent-tasks: 3

feedback:
  use-action-bar: true
  sounds:
    enabled: true
    success: "entity.player.levelup"
    error: "entity.villager.no"
    start: "block.note_block.chime"

